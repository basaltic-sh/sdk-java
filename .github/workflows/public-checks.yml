# Generated by the public release publisher. Source snapshots originate in GitLab.
name: Public source checks
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    container: maven:3.9.16-eclipse-temurin-${{ matrix.java }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install check tools
        run: apt-get update -qq && apt-get install -y --no-install-recommends python3
      - run: python3 scripts/check.py
      - run: python3 scripts/check_package.py
  publish:
    name: Publish Maven Central package
    if: github.ref_type == 'tag' && vars.MAVEN_RELEASE_ENABLED == 'true'
    needs: source
    runs-on: ubuntu-latest
    container: maven:3.9.16-eclipse-temurin-17
    timeout-minutes: 45
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/sh.basaltic/sdk-java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verification tools
        run: apt-get update -qq && apt-get install -y --no-install-recommends python3
      - name: Verify the package from the public tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check_package.py
      - name: Sign and publish to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: python3 scripts/publish_central.py
